name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  OPEN_BITCOIN_PARITY_REPORT_DIR: ${{ github.workspace }}/packages/target/parity-reports
  OPEN_BITCOIN_BENCHMARK_REPORT_DIR: ${{ github.workspace }}/packages/target/benchmark-reports

jobs:
  verify:
    name: verify (${{ matrix.shard }})
    runs-on: ubuntu-24.04

    # The shards partition the full verification contract, so the union of
    # these jobs equals one `bash scripts/verify.sh --profile` run.
    # scripts/verify-shards.test.ts keeps this list equal to
    # `bash scripts/verify.sh --list-shards`.
    strategy:
      # Let every shard report, so one rerun of the failed jobs is enough.
      fail-fast: false
      matrix:
        shard:
          - checks
          - native-test-node
          - native-test-rpc
          - native-test
          - native-release
          - checker-tests-158
          - checker-tests-159-163
          - checker-tests-164
          - checker-tests-165
          - checker-tests-other

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      # Checker-test shards do not compile Rust; they only read the checks cache.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-open-bitcoin-rust
          key: ${{ startsWith(matrix.shard, 'checker-tests-') && 'checks' || matrix.shard }}
          workspaces: packages -> target
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(matrix.shard, 'checker-tests-') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Check Bun version
        run: bun --version

      - name: Check direct-main hooks
        if: matrix.shard == 'checks'
        run: |
          bun test ./scripts/check-push-verification.test.ts
          bun test ./scripts/verify-shards.test.ts
          bun test ./scripts/verify/sample-checker-tests.test.ts
          bash scripts/test-ensure-git-hooks.sh
          bash scripts/test-check-file-lengths.sh

      # setup-bazel publishes numeric tags like 0.x.y, not v0.x.y.
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 'native-release' }}

      - name: Run repo verification
        run: bash scripts/verify.sh --profile --shard "${{ matrix.shard }}"

      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-reports-${{ matrix.shard }}
          path: packages/target/parity-reports
          if-no-files-found: ignore

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reports-${{ matrix.shard }}
          path: packages/target/benchmark-reports
          if-no-files-found: ignore
