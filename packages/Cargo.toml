[workspace]
members = [
    "open-bitcoin-chainstate",
    "open-bitcoin-network",
    "open-bitcoin-core",
    "open-bitcoin-consensus",
    "open-bitcoin-primitives",
    "open-bitcoin-codec",
    "open-bitcoin-mempool",
    "open-bitcoin-wallet",
    "open-bitcoin-node",
    "open-bitcoin-rpc",
    "open-bitcoin-cli",
    "open-bitcoin-test-harness",
    "open-bitcoin-bench",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bright-builds-llc/open-bitcoin"
version = "0.1.0"

[profile.test]
opt-level = 2
# Backtraces keep file and line; full variable debuginfo only slowed the build.
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# The node crate is most of the workspace's build time. Level 1 builds it about
# a quarter faster than level 2 and its tests run at the same speed.
[profile.test.package.open-bitcoin-node]
opt-level = 1
