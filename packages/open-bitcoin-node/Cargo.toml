[package]
name = "open-bitcoin-node"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
fjall = { git = "https://github.com/fjall-rs/fjall", rev = "aa30dca811399a201e0b9595da93a4582dcb2b57", default-features = false }
fs4 = "1.1.0"
getrandom = "0.3.4"
open-bitcoin-codec = { path = "../open-bitcoin-codec" }
open-bitcoin-core = { path = "../open-bitcoin-core" }
open-bitcoin-mempool = { path = "../open-bitcoin-mempool" }
open-bitcoin-network = { path = "../open-bitcoin-network" }
open-bitcoin-wallet = { path = "../open-bitcoin-wallet" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
