[package]
name = "open-bitcoin-rpc"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
getrandom = "0.3.4"
jsonc-parser = { version = "0.32.3", features = ["serde"] }
open-bitcoin-codec = { path = "../open-bitcoin-codec" }
open-bitcoin-network = { path = "../open-bitcoin-network" }
open-bitcoin-node = { path = "../open-bitcoin-node" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
open-bitcoin-test-harness = { path = "../open-bitcoin-test-harness" }
